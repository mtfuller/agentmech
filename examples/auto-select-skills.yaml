name: "Auto-Select Skills Example"
description: "Demonstrates automatic skill selection by the LLM based on the task"
type: "agent"
default_model: "gemma3:4b"

start_state: "task_input"

# Define skills that can be automatically selected
skills:
  planning_skills:
    directory: "./planner/skills"

states:
  task_input:
    type: "input"
    prompt: |
      I'm your AI assistant with planning and analysis skills.
      
      What task would you like help with?
    save_as: "user_task"
    next: "process_task"
  
  process_task:
    type: "prompt"
    prompt: |
      Help the user with their task:
      {{user_task}}
      
      Use your skills and expertise to provide a comprehensive response.
    # Note: No explicit skills specified - the LLM will automatically select relevant skills
    save_as: "response"
    next: "end"
